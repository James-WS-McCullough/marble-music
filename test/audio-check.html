<!doctype html>
<meta charset="utf-8">
<title>Instrument check</title>
<body style="font:14px system-ui;background:#1b1d26;color:#e8eaf6;padding:16px">
<h3>Instrument audition</h3>
<p>Renders a short phrase (lead with chords, then bass) on each object's own voice, plus the lofi beat with its switch effects. Click to listen.</p>
<div id="out"></div>
<pre id="log"></pre>
<script>window.onerror = (m, s, l) => { document.getElementById('log').textContent += 'ERR ' + m + ' @' + l + '\n'; };
window.addEventListener('unhandledrejection', (e) => { document.getElementById('log').textContent += 'REJ ' + e.reason + '\n' + (e.reason && e.reason.stack) + '\n'; });</script>
<script type="module">
import { Synth, OBJECT_VOICES } from '../src/audio.js';
const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
const lead = [72, 74, 76, 79, 76, 74, 72, 67];
const phrase = (s, obj) => {
  lead.forEach((m, i) => s.playHit([{ midi: m, vel: 0.85, dur: i === 7 ? 0.9 : 0.22, ch: 0 }, ...(i % 4 === 0 ? [{ midi: m - 8, vel: 0.6, dur: 0.4, ch: 0 }, { midi: m - 12, vel: 0.6, dur: 0.4, ch: 0 }] : [])], 0.1 + i * 0.25, 'lead', obj));
  [48, 43, 45, 41].forEach((m, i) => s.playHit([{ midi: m, vel: 0.7, dur: 0.45, ch: 1 }], 2.3 + i * 0.4, 'bass', obj));
};
const beat = (s) => { // the lofi beat: muffled, then the switch opens the filter
  s.setLofi(true, 0); s.setCrackle(true, 0); s.setFilter(true, 0); s.setFilter(false, 1.6);
  for (let i = 0; i < 16; i++) s.playBeat({ midi: i % 8 === 0 || i % 8 === 5 ? 36 : i % 4 === 2 ? 38 : 42, vel: 0.8, ch: 9 }, 0.1 + i * 0.2);
  s.playHit([], 1.6, 'lead', 'switch');
};
const results = {};
for (const [name, fn] of [...Object.keys(OBJECT_VOICES).map((o) => [o, (s) => phrase(s, o)]), ['lofi beat + switch', beat]]) {
  const ctx = new OfflineAudioContext(2, 44100 * 4.2, 44100);
  const synth = new Synth(ctx);
  let err = null;
  try { fn(synth); } catch (e) { err = String(e); }
  const buf = await ctx.startRendering();
  const d = buf.getChannelData(0);
  let peak = 0, sum = 0, nan = 0;
  for (const x of d) { if (Number.isNaN(x)) nan++; peak = Math.max(peak, Math.abs(x)); sum += x * x; }
  results[name] = { err, peak: +peak.toFixed(3), rms: +Math.sqrt(sum / d.length).toFixed(4), nan };
  const btn = document.createElement('button');
  btn.textContent = `▶ ${name}`;
  btn.style.cssText = 'display:block;margin:6px 0;padding:6px 10px';
  btn.onclick = () => { const ac = new AudioContext(); const s = ac.createBufferSource(); s.buffer = buf; s.connect(ac.destination); s.start(); };
  document.getElementById('out').append(btn);
}
log('AUDIO_CHECK ' + JSON.stringify(results));
</script>
