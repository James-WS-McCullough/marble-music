<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marble Music</title>
  <style>
    :root { --panel: rgba(14, 16, 28, 0.82); --text: #e8eaf6; --muted: #9aa0c0; --accent: #ffb347; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07080f; color: var(--text);
      font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
    canvas { display: block; }
    #panel { position: fixed; top: 12px; left: 12px; width: 280px; padding: 12px 14px; border-radius: 12px;
      background: var(--panel); backdrop-filter: blur(8px); box-shadow: 0 6px 24px rgba(0,0,0,.4); }
    #panel h1 { font-size: 15px; margin: 0 0 8px; letter-spacing: .02em; }
    #panel label { display: block; color: var(--muted); margin: 8px 0 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    #panel select, #panel input[type=number] { width: 100%; box-sizing: border-box; background: #1b1e33; color: var(--text);
      border: 1px solid #2c3050; border-radius: 6px; padding: 5px 6px; font: inherit; }
    .row { display: flex; gap: 6px; align-items: center; }
    .row > * { flex: 1; }
    button { background: #2a2f52; color: var(--text); border: 1px solid #3a4070; border-radius: 6px; padding: 6px 8px;
      font: inherit; cursor: pointer; }
    button:hover { background: #353b66; }
    button.primary { background: var(--accent); color: #1a1206; border-color: transparent; font-weight: 600; }
    #info { margin-top: 10px; color: var(--muted); font-size: 12px; min-height: 2.8em; }
    #file { display: none; }
    #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5,6,12,.55); cursor: pointer; }
    #start div { text-align: center; }
    #start b { display: block; font-size: 28px; margin-bottom: 6px; }
    #toggle { position: fixed; top: 12px; right: 12px; }
    #panel.hidden { display: none; }
    @media (max-width: 600px) { #panel { width: auto; right: 12px; } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="panel">
    <h1>🎵 Marble Music</h1>
    <label for="song">Song</label>
    <select id="song">
      <option value="proc">Procedural (from seed)</option>
      <option value="ode">Ode to Joy</option>
      <option value="twinkle">Twinkle Twinkle</option>
      <option value="elise">Für Elise (opening)</option>
    </select>
    <label for="seed">Seed</label>
    <div class="row">
      <input id="seed" type="number" value="1" min="0" />
      <button id="dice" title="Random seed">🎲 New</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="loadMidi">Load MIDI…</button>
      <input id="file" type="file" accept=".mid,.midi,audio/midi" />
    </div>
    <label for="font">Sound font</label>
    <select id="font">
      <option value="nes">NES 8-bit (2A03-style)</option>
      <option value="snes">SNES 16-bit (SPC700-style)</option>
      <option value="genesis">Genesis FM (YM2612-style)</option>
      <option value="mallets">Acoustic ensemble (marimba + vibes)</option>
      <option value="marimba">Marimba (original)</option>
      <option value="glock">Glockenspiel (original)</option>
      <option value="vibes">Vibraphone (original)</option>
    </select>
    <label for="second">Second marble</label>
    <select id="second">
      <option value="auto">Auto (drums if the song has them)</option>
      <option value="harmony">Harmony / bass</option>
      <option value="percussion">Percussion</option>
      <option value="none">None (melody only)</option>
    </select>
    <label for="pace">Marble pace</label>
    <select id="pace">
      <option value="2.3" selected>Calm (max 2.3 m/s)</option>
      <option value="3.0">Lively (max 3 m/s)</option>
      <option value="4.0">Fast (max 4 m/s, pads sparsest)</option>
    </select>
    <label for="cam">Camera</label>
    <select id="cam">
      <option value="follow">Follow marble</option>
      <option value="overview">Overview orbit</option>
      <option value="free">Free (drag to orbit)</option>
    </select>
    <div class="row" style="margin-top:10px">
      <button id="play" class="primary">Pause</button>
      <button id="export" title="Download the course as JSON">Export JSON</button>
    </div>
    <div id="info"></div>
  </div>
  <button id="toggle" title="Hide/show panel (H)">☰</button>
  <div id="start"><div><b>▶ Click to start</b><span style="color:#9aa0c0">audio needs a click to begin</span></div></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
