<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marble Music</title>
  <style>
    :root { --panel: rgba(14, 16, 28, 0.82); --text: #e8eaf6; --muted: #9aa0c0; --accent: #ffb347; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07080f; color: var(--text);
      font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
    canvas { display: block; transition: filter .5s; }
    /* a lofi switch block has closed the filter: the picture goes soft and warm too */
    canvas.muffled { filter: saturate(.72) sepia(.18) brightness(.94) contrast(.94); }
    #panel { position: fixed; top: 12px; left: 12px; width: 280px; padding: 12px 14px; border-radius: 12px;
      background: var(--panel); backdrop-filter: blur(8px); box-shadow: 0 6px 24px rgba(0,0,0,.4); }
    #panel h1 { font-size: 15px; margin: 0 0 8px; letter-spacing: .02em; }
    #panel label { display: block; color: var(--muted); margin: 8px 0 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    #panel select, #panel input[type=number] { width: 100%; box-sizing: border-box; background: #1b1e33; color: var(--text);
      border: 1px solid #2c3050; border-radius: 6px; padding: 5px 6px; font: inherit; }
    .row { display: flex; gap: 6px; align-items: center; }
    .row > * { flex: 1; }
    button { background: #2a2f52; color: var(--text); border: 1px solid #3a4070; border-radius: 6px; padding: 6px 8px;
      font: inherit; cursor: pointer; }
    button:hover { background: #353b66; }
    button.primary { background: var(--accent); color: #1a1206; border-color: transparent; font-weight: 600; }
    #info { margin-top: 10px; color: var(--muted); font-size: 12px; min-height: 2.8em; }
    #file { display: none; }
    #panel { max-height: calc(100vh - 24px); overflow-y: auto; box-sizing: border-box; }
    #settings { margin-top: 10px; border-top: 1px solid #2c3050; padding-top: 6px; }
    #settings summary { cursor: pointer; color: var(--text); font-weight: 600; padding: 4px 0; }
    #panel input[type=range] { width: 100%; accent-color: var(--accent); }
    #panel label.check { text-transform: none; letter-spacing: 0; font-size: 12px; display: flex; gap: 6px; align-items: center; }
    #panel label span { color: var(--text); text-transform: none; }
    #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5,6,12,.55); cursor: pointer; }
    #start div { text-align: center; }
    #start b { display: block; font-size: 28px; margin-bottom: 6px; }
    #toggle { position: fixed; top: 12px; right: 12px; }
    #panel.hidden { display: none; }
    /* planning spinner */
    #planning { position: fixed; inset: 0; display: none; place-items: center; background: rgba(5,6,12,.35);
      backdrop-filter: blur(2px); pointer-events: none; z-index: 5; }
    #planning.on { display: grid; }
    #planning .box { background: var(--panel); padding: 18px 22px; border-radius: 14px; min-width: 260px; text-align: center;
      box-shadow: 0 6px 24px rgba(0,0,0,.4); }
    #planning .spinner { width: 34px; height: 34px; margin: 2px auto 12px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,.18); border-top-color: var(--accent); animation: spin .8s linear infinite; }
    #planning .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: 10px; }
    #planning .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #planning .spinner { animation-duration: 2.4s; } }
    @media (max-width: 600px) { #panel { width: auto; right: 12px; } }
  </style>
</head>
<body>
  <div id="panel">
    <h1>🎵 Marble Music</h1>
    <label for="song">Song</label>
    <select id="song">
      <option value="endless">Endless lofi ∞</option>
      <option value="lofi">Lofi (from seed)</option>
      <option value="proc">Procedural (from seed)</option>
      <option value="ode">Ode to Joy</option>
      <option value="twinkle">Twinkle Twinkle</option>
      <option value="elise">Für Elise (opening)</option>
    </select>
    <label for="seed">Seed</label>
    <div class="row">
      <input id="seed" type="number" value="1" min="0" />
      <button id="dice" title="Random seed">🎲 New</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="loadMidi">Load MIDI…</button>
      <input id="file" type="file" accept=".mid,.midi,audio/midi" />
    </div>
    <label for="second">Second marble</label>
    <select id="second">
      <option value="auto">Auto (drums if the song has them)</option>
      <option value="harmony">Harmony / bass</option>
      <option value="percussion">Percussion</option>
      <option value="none">None (melody only)</option>
    </select>
    <label for="pace">Marble pace</label>
    <select id="pace">
      <option value="2.3" selected>Calm (max 2.3 m/s)</option>
      <option value="3.0">Lively (max 3 m/s)</option>
      <option value="4.0">Fast (max 4 m/s, pads sparsest)</option>
    </select>
    <label for="melodyObj">Melody plays on</label>
    <select id="melodyObj">
      <option value="mix">Mix by song section</option>
      <option value="song">One per song (changes each song)</option>
      <option value="key">Keys</option>
      <option value="epiano">Electric piano keys</option>
      <option value="guitar">Guitar strings</option>
      <option value="button">Arcade buttons</option>
      <option value="tube">Metal chime tubes</option>
      <option value="bamboo">Bamboo tubes</option>
      <option value="bottle">Glass bottles</option>
      <option value="neon">Neon light tubes</option>
      <option value="bell">Handbells</option>
    </select>
    <label for="harmonyObj">Harmony / bass plays on</label>
    <select id="harmonyObj">
      <option value="mix">Mix by song section</option>
      <option value="bar">Wooden bars</option>
      <option value="vinyl">Vinyl records</option>
      <option value="guitar">Guitar strings</option>
      <option value="epiano">Electric piano keys</option>
      <option value="button">Arcade buttons</option>
      <option value="tube">Metal chime tubes</option>
      <option value="bamboo">Bamboo tubes</option>
      <option value="bottle">Glass bottles</option>
      <option value="neon">Neon light tubes</option>
      <option value="bell">Handbells</option>
    </select>
    <label for="drumKit">Drums play on</label>
    <select id="drumKit">
      <option value="kit">Drum kit</option>
      <option value="blocks">Woodblocks &amp; cowbells</option>
      <option value="mix">Mix by song section</option>
    </select>
    <label for="theme">Theme</label>
    <select id="theme">
      <option value="sky">Sky</option>
      <option value="spooky">Spooky</option>
      <option value="lab">Lab</option>
      <option value="lofi">Lofi bedroom</option>
    </select>
    <label for="cam">Camera</label>
    <select id="cam">
      <option value="follow">Follow marble</option>
      <option value="overview">Overview orbit</option>
      <option value="free">Free (drag to orbit)</option>
    </select>
    <details id="settings">
      <summary>Settings</summary>
      <label for="zoom">Camera zoom <span id="zoomVal"></span></label>
      <input id="zoom" type="range" min="0.7" max="1.5" step="0.05" value="1" />
      <label for="bright">Brightness <span id="brightVal"></span></label>
      <input id="bright" type="range" min="0.6" max="1.4" step="0.05" value="1" />
      <label for="glow">Glow <span id="glowVal"></span></label>
      <input id="glow" type="range" min="0" max="1" step="0.05" value="0.15" />
      <label for="deco">Decorations</label>
      <select id="deco">
        <option value="1">Normal</option>
        <option value="0.5">Fewer</option>
        <option value="0">None</option>
        <option value="1.6">More</option>
      </select>
      <label for="volume">Volume <span id="volumeVal"></span></label>
      <input id="volume" type="range" min="0" max="1" step="0.05" value="1" />
      <label class="check"><input id="lofiFx" type="checkbox" checked /> Lofi switch effects (filter, crackle)</label>
    </details>
    <div class="row" style="margin-top:10px">
      <button id="play" class="primary">Pause</button>
      <button id="export" title="Download the course as JSON">Export JSON</button>
    </div>
    <div id="info"></div>
  </div>
  <button id="toggle" title="Hide/show panel (H)">☰</button>
  <div id="planning" role="status" aria-live="polite"><div class="box">
    <div class="spinner"></div><div id="planningText">Planning course…</div><div class="bar"><div id="planningBar"></div></div>
  </div></div>
  <div id="start"><div><b>▶ Click to start</b><span style="color:#9aa0c0">audio needs a click to begin</span></div></div>
  <script>
    // GitHub Pages lets browsers cache files for 10 minutes, so right after a deploy a browser
    // could mix old and new scripts. Load every module with this visit's version tag (via an
    // import map, set up before any module loads) so they always come from the same version.
    (() => {
      const v = Date.now().toString(36);
      const imports = {
        three: 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js',
        'three/addons/': 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/',
      };
      for (const m of ['main', 'planner', 'music', 'midi', 'audio', 'util', 'camera', 'themes', 'timeline'])
        imports[`./src/${m}.js`] = `./src/${m}.js?v=${v}`;
      const map = document.createElement('script');
      map.type = 'importmap';
      map.textContent = JSON.stringify({ imports });
      document.body.append(map);
      window.APP_VERSION = v;
      const main = document.createElement('script');
      main.type = 'module';
      main.src = `./src/main.js?v=${v}`;
      document.body.append(main);
    })();
  </script>
</body>
</html>
